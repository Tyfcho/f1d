<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weer in Breda</title>
    <style>
        :root {
            color-scheme: light;
            --text: #1a1a1a;
            --muted: #666666;
            --line: rgba(0, 0, 0, 0.12);
            --chip: rgba(0, 0, 0, 0.04);
            /* Hoofdkleur (Kropman-groen): pas alleen deze twee regels aan voor de exacte huisstijlkleur */
            --brand-rgb: 63, 174, 73;
            --brand-light: #2b7a33;
            --rain: #0077cc;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            font: 16px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            user-select: none; cursor: none;
            background: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        [hidden] { display: none !important; }
        a { pointer-events: none; text-decoration: none; color: inherit; }

        .app {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.6vh 1.2vw;
            overflow: hidden;
        }

        /* ---------- Glas / Vlak styling voor witte achtergrond ---------- */
        .glass {
            position: relative;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 2.6vh;
            box-shadow: 0 0.8vh 2.4vh rgba(0, 0, 0, 0.06);
            min-width: 0; min-height: 0; overflow: hidden;
        }
        .card { display: flex; flex-direction: column; padding: 1.8vh 1.3vw 3vh; }
        .card > h2 {
            margin: 0 0 1vh; font-size: clamp(.7rem, 1.5vh, 1rem); font-weight: 600;
            text-transform: uppercase; letter-spacing: .14em; color: var(--muted);
        }
        .src {
            position: absolute; right: 1.1vw; bottom: .9vh;
            font-size: clamp(.58rem, 1.1vh, .78rem); color: var(--muted); opacity: .7;
        }

        /* ---------- Hoofdgrid ---------- */
        .grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.2vw; width: 100%; height: 100%; min-height: 0; flex: 1; }
        .grid.imagemode { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
        .left { display: grid; grid-template-rows: minmax(0, 1.45fr) minmax(0, 1fr); gap: 1.4vh; min-height: 0; height: 100%; }

        /* ---------- Nu ---------- */
        .nowbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.2vh; }
        .nowtop { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
        .currentrow { display: flex; align-items: center; gap: 1.6vw; min-width: 0; }
        .weathericon {
            font-size: clamp(3rem, 11vh, 8rem);
            line-height: 1;
            color: var(--brand-light);
            filter: drop-shadow(0 .4vh 1vh rgba(0, 0, 0, 0.15));
        }
        .weather-svg { display: block; width: 1em; height: 1em; overflow: visible; }
        .weather-svg .cloud { fill: #fff; stroke: currentColor; }
        .weather-svg .sun, .weather-svg .sun-rays { fill: #fff; stroke: #e6a700; }
        .weather-svg .sun-rays { stroke-linecap: round; }
        .weather-svg .precip { fill: none; stroke: var(--rain); stroke-linecap: round; }
        .weather-svg .lightning { fill: #f2b600; stroke: #d99a00; stroke-linejoin: round; }
        .weather-svg .fog { fill: none; stroke: #7a8790; stroke-linecap: round; }
        .rain-chance-icon { width: .78em; height: .78em; vertical-align: -.1em; fill: none; stroke: currentColor; stroke-width: 2.5; }
        .currenttemp { font-size: clamp(3.2rem, 14vh, 10rem); line-height: .9; font-weight: 200; letter-spacing: -.05em; color: #111; }
        .currenttemp .dec { font-size: .42em; font-weight: 300; letter-spacing: 0; margin-left: .04em; vertical-align: baseline; opacity: .85; }
        .currentdesc { font-size: clamp(1rem, 2.8vh, 1.9rem); font-weight: 500; color: var(--muted); margin-top: .6vh; }

        .metrics {
            flex: 0 0 auto; width: clamp(150px, 17vw, 330px);
            display: flex; flex-direction: column;
            background: var(--chip); border: 1px solid var(--line); border-radius: 2vh;
            padding: .4vh 1vw;
        }
        .metric { display: flex; align-items: baseline; justify-content: space-between; gap: 1vw; padding: 1vh 0; }
        .metric + .metric { border-top: 1px solid var(--line); }
        .metric small { font-size: clamp(.72rem, 1.5vh, 1rem); color: var(--muted); letter-spacing: .02em; }
        .metric b { font-size: clamp(1.05rem, 2.8vh, 2rem); font-weight: 600; white-space: nowrap; color: #111; }
        .metric b em { font-style: normal; font-weight: 400; font-size: .6em; color: var(--muted); margin-left: .2em; }

        .chartwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .6vh; border-top: 1px solid var(--line); padding-top: 1.1vh; }
        .charthead { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; }
        .charthead .t { font-size: clamp(.7rem, 1.5vh, 1rem); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
        .charthead .s { font-size: clamp(.85rem, 1.9vh, 1.3rem); font-weight: 500; color: var(--text); }
        .charthead .s b { color: var(--brand-light); font-weight: 600; }
        .charthead .s i { font-style: normal; color: var(--rain); font-weight: 600; }
        #chart { flex: 1; min-height: 0; position: relative; width: 100%; height: 100%; }
        #chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }

        /* ---------- Verwachting ---------- */
        .days { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .8vw; }
        .day {
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
            background: var(--chip); border: 1px solid var(--line); border-radius: 2.2vh;
            padding: 1vh .4vw; min-height: 0; text-align: center;
        }
        .day:first-child { background: rgba(var(--brand-rgb), .1); border-color: rgba(var(--brand-rgb), .4); }
        .day .dname { font-weight: 600; text-transform: capitalize; font-size: clamp(.95rem, 2.4vh, 1.7rem); color: #111; }
        .day .dicon {
            font-size: clamp(2rem, 6vh, 4.2rem);
            line-height: 1;
            color: var(--brand-light);
        }
        .day .dtemp { font-weight: 600; font-size: clamp(1.1rem, 3.1vh, 2.3rem); white-space: nowrap; color: #111; }
        .day .dtemp i { font-style: normal; color: var(--muted); font-weight: 400; margin-right: .35em; }
        .day .drain { color: var(--rain); font-size: clamp(.8rem, 1.9vh, 1.35rem); font-weight: 600; line-height: 1.2; }
        .day .drain small { display: block; font-size: .78em; font-weight: 500; opacity: .85; }

        /* ---------- Radar ---------- */
        .mapcard { display: flex; flex-direction: column; padding: 1.8vh 1vw 3vh; }
        .mapcard > h2 { padding-left: .3vw; }
        #radarframe {
            flex: 1; min-height: 0; background: #fff; position: relative;
            border: 1px solid var(--line); border-radius: 1.8vh; overflow: hidden;
            box-shadow: 0 0.5vh 1.5vh rgba(0, 0, 0, 0.05);
        }
        #radarimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
        #radariframe {
            position: absolute; top: 50%; left: 50%;
            width: 550px; height: 512px; border: 0;
            transform-origin: center center;
            transform: translate(-50%, -50%);
            pointer-events: none; /* niet bedienbaar */
        }

        .loading { color: var(--muted); }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
<div class="app">
    <div class="grid">
        <div class="left">
            <section class="glass card">
                <h2>Nu</h2>
                <div class="nowbody">
                    <div class="nowtop" id="current"><span class="loading">Actuele weerdata ophalen…</span></div>
                    <div class="chartwrap">
                        <div class="charthead">
                            <span class="t">Komende 3 uur</span>
                            <span class="s" id="chartsummary"></span>
                        </div>
                        <div id="chart"><span class="loading">Verwachting laden…</span></div>
                    </div>
                </div>
                <span class="src" id="nowsrc">Bron: Buienradar · Open-Meteo</span>
            </section>

            <section class="glass card">
                <h2>Komende dagen</h2>
                <div id="forecast" class="loading">Verwachting laden…</div>
                <span class="src">Bron: Buienradar</span>
            </section>
        </div>

        <section class="glass mapcard" id="mapcard">
            <h2>Neerslagradar</h2>
            <div id="radarframe">
                <img id="radarimg" alt="Buienradar neerslagradar">
                <iframe id="radariframe" title="Buienradar neerslagradar" scrolling="no" tabindex="-1" hidden></iframe>
            </div>
            <span class="src">Bron: Buienradar · update elke 5 min</span>
        </section>
    </div>
</div>

<script>
    const BR_FEED = 'https://data.buienradar.nl/2.0/feed/json';
    const HOME = { lat: 51.58656, lng: 4.77596 };
    const OPEN_METEO = 'https://api.open-meteo.com/v1/forecast?latitude=' + HOME.lat + '&longitude=' + HOME.lng +
        '&minutely_15=temperature_2m,precipitation&hourly=temperature_2m,precipitation' +
        '&timeformat=unixtime&timezone=Europe%2FAmsterdam&forecast_hours=6&forecast_minutely_15=24';
    const RADAR_URL = 'https://gadgets.buienradar.nl/gadget/zoommap/?lat=51.58656&lng=4.77596&overname=2&zoom=8&naam=Breda&size=3&voor=1&forecast=3';

    const brCurrent = document.getElementById('current');
    const forecastEl = document.getElementById('forecast');
    const chartEl = document.getElementById('chart');

    // Draw icons as inline SVG so they work even when the kiosk image has no emoji fonts.
    const iconFor = (text = '') => {
        text = text.toLowerCase();
        let type = 'partly';
        if (/onweer|bliksem/.test(text)) type = 'storm';
        else if (/regen|buien|nat/.test(text)) type = 'rain';
        else if (/sneeuw|ijzel/.test(text)) type = 'snow';
        else if (/mist|nevel/.test(text)) type = 'fog';
        else if (/half|licht bewolkt|opklar|wolkenvelden/.test(text)) type = 'partly';
        else if (/zwaar bewolkt|bewolkt|wolken|grijs/.test(text)) type = 'cloudy';
        else if (/zon|helder/.test(text)) type = 'sun';

        const sun = '<circle class="sun" cx="23" cy="24" r="9" stroke-width="2.5"/><g class="sun-rays" stroke-width="2.5"><path d="M23 7v4M23 37v4M6 24h4M36 24h4M11 12l3 3M32 33l3 3M35 12l-3 3M14 33l-3 3"/></g>';
        const cloud = '<path class="cloud" stroke-width="2.7" stroke-linejoin="round" d="M17 45h29a9 9 0 0 0 1-18 15 15 0 0 0-29-2 10 10 0 0 0-1 20Z"/>';
        const rain = '<g class="precip" stroke-width="3"><path d="m23 49-3 6M34 49l-3 6M45 49l-3 6"/></g>';
        const snow = '<g class="precip" stroke-width="2.5"><path d="M22 49v9M18 51l8 5M26 51l-8 5M36 49v9M32 51l8 5M40 51l-8 5M50 49v9M46 51l8 5M54 51l-8 5"/></g>';
        const fog = '<g class="fog" stroke-width="3"><path d="M12 50h40M17 56h30"/></g>';
        const storm = '<path class="lightning" stroke-width="1.5" d="m34 42-9 13h7l-3 10 14-17h-8l5-6Z"/>';
        let drawing;
        switch (type) {
            case 'sun': drawing = sun; break;
            case 'partly': drawing = sun + cloud; break;
            case 'cloudy': drawing = cloud; break;
            case 'rain': drawing = cloud + rain; break;
            case 'snow': drawing = cloud + snow; break;
            case 'fog': drawing = cloud + fog; break;
            default: drawing = cloud + storm;
        }
        return `<svg class="weather-svg" viewBox="0 0 64 64" aria-hidden="true">${drawing}</svg>`;
    };

    const val = (obj, ...keys) => {
        for (const k of keys) if (obj && obj[k] != null) return obj[k];
        return null;
    };

    function num(v, d = 1) {
        const n = Number(v);
        return Number.isFinite(n) ? n.toFixed(d) : '—';
    }
    const nl = (v, d = 1) => num(v, d).replace('.', ',');

    function bigTemp(v) {
        const n = Number(v);
        if (!Number.isFinite(n)) return '—°';
        const s = Math.abs(n).toFixed(1), [i, f] = s.split('.');
        return (n < 0 ? '−' : '') + i + '<span class="dec">,' + f + '°</span>';
    }

    function setError(el, msg) { el.innerHTML = '<p class="error">' + msg + '</p>'; }

    function distance(lat1, lon1, lat2, lon2) {
        return Math.hypot((Number(lat1) - lat2) * 111, (Number(lon1) - lon2) * 70);
    }

    function dayName(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '—';
        if (d.toDateString() === new Date().toDateString()) return 'Vandaag';
        return d.toLocaleDateString('nl-NL', { weekday: 'short' }).replace('.', '');
    }

    async function loadBuienradar() {
        let data;
        try {
            const r = await fetch(BR_FEED, { cache: 'no-store' });
            if (!r.ok) throw Error('HTTP ' + r.status);
            data = await r.json();
        } catch (e) {
            setError(brCurrent, 'Actuele data niet beschikbaar.');
            setError(forecastEl, 'Verwachting niet beschikbaar.');
            return;
        }

        try {
            const stations = data.actual?.stationmeasurements || [];
            const station = stations.find(s => /breda/i.test(s.stationname || s.station || '')) ||
                stations.sort((a, b) =>
                    distance(a.latitude, a.longitude, HOME.lat, HOME.lng) -
                    distance(b.latitude, b.longitude, HOME.lat, HOME.lng)
                )[0];
            if (!station) throw Error('Geen station gevonden');

            const temp = val(station, 'temperature', 'temperatureC');
            const feel = val(station, 'feeltemperature', 'feelTemperature');
            const wind = val(station, 'windspeed', 'windSpeed');
            const gust = val(station, 'windgusts', 'windGusts');
            const desc = val(station, 'weatherdescription', 'weatherDescription') || 'Actuele meting';
            const rainHr = Number(val(station, 'rainFallLastHour', 'rainfalllasthour', 'precipitation'));
            const rainRow = Number.isFinite(rainHr)
                ? `<div class="metric"><small>Regen (laatste uur)</small><b>${nl(rainHr)}<em>mm</em></b></div>` : '';

            brCurrent.className = 'nowtop';
            brCurrent.innerHTML = `
          <div class="currentrow">
            <div class="weathericon">${iconFor(desc)}</div>
            <div>
              <div class="currenttemp">${bigTemp(temp)}</div>
              <div class="currentdesc">${desc}</div>
            </div>
          </div>
          <div class="metrics">
            <div class="metric"><small>Gevoel</small><b>${nl(feel)}°</b></div>
            <div class="metric"><small>Wind</small><b>${nl(wind)}<em>m/s</em></b></div>
            <div class="metric"><small>Windstoten</small><b>${nl(gust)}<em>m/s</em></b></div>
            ${rainRow}
          </div>`;
            document.getElementById('nowsrc').textContent =
                'Bron: Buienradar (' + (station.stationname || 'dichtstbijzijnd station') + ') · Open-Meteo · ' +
                new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
            setError(brCurrent, 'Actuele data niet beschikbaar.');
        }

        try {
            const days = (data.forecast?.fivedayforecast || []).slice(0, 5);
            if (!days.length) throw Error('Geen verwachting');

            forecastEl.className = 'days';
            forecastEl.innerHTML = days.map(d => {
                const desc = val(d, 'weatherdescription', 'weatherDescription') || '';
                const min = val(d, 'mintemperatureMax', 'mintemperature', 'mintemperatureMin');
                const max = val(d, 'maxtemperatureMax', 'maxtemperature', 'maxtemperatureMin');
                const rain = val(d, 'rainChance');
                const mmMin = Number(val(d, 'mmRainMin')), mmMax = Number(val(d, 'mmRainMax'));
                const f = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
                let mm = '';
                if (Number.isFinite(mmMax)) {
                    mm = mmMax < 0.1 ? '0 mm'
                        : (Number.isFinite(mmMin) && mmMin >= 0.1 && mmMin < mmMax ? f(mmMin) + '–' + f(mmMax) : f(mmMax)) + ' mm';
                }
                return `<div class="day">
                <span class="dname">${dayName(d.day)}</span>
                <span class="dicon">${iconFor(desc)}</span>
                <span class="dtemp"><i>${num(min, 0)}°</i>${num(max, 0)}°</span>
                <span class="drain">${rain != null ? '<svg class="rain-chance-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-7.5 8-13a8 8 0 1 0-16 0c0 5.5 8 13 8 13Z"/><circle cx="12" cy="9" r="2.5"/></svg> ' + rain + '%' : '&nbsp;'}<small>${mm || '0 mm'}</small></span>
            </div>`;
            }).join('');
        } catch (e) {
            setError(forecastEl, 'Verwachting niet beschikbaar.');
        }
    }

    let chartPoints = null;

    async function loadShortTerm() {
        try {
            const r = await fetch(OPEN_METEO, { cache: 'no-store' });
            if (!r.ok) throw Error('HTTP ' + r.status);
            const j = await r.json();

            let src = j.minutely_15, step = 900;
            if (!src?.time?.length) { src = j.hourly; step = 3600; }
            if (!src?.time?.length) throw Error('Geen data');

            const nowSec = Date.now() / 1000;
            const start = Math.floor(nowSec / step) * step;
            const end = start + 3 * 3600;
            const pts = [];
            src.time.forEach((t, i) => {
                if (t >= start && t <= end) {
                    pts.push({ t, temp: src.temperature_2m[i], rain: src.precipitation?.[i] ?? 0 });
                }
            });
            if (pts.length < 2) throw Error('Te weinig punten');
            chartPoints = { pts, step };
            drawChart();
        } catch (e) {
            console.warn('Open-Meteo:', e);
            chartPoints = null;
            chartEl.innerHTML = '<span class="error">Verwachting komende uren niet beschikbaar.</span>';
            document.getElementById('chartsummary').textContent = '';
        }
    }

    function drawChart() {
        if (!chartPoints) return;
        const W = chartEl.clientWidth, H = chartEl.clientHeight;
        if (W < 50 || H < 50) return;

        const { pts, step } = chartPoints;
        const fs = Math.max(12, Math.min(18, H * 0.11));
        const labelH = fs * 2.0;
        const topPad = fs * 2.4;
        const rainH = H * 0.18;
        const padX = fs * 1.5;
        const yBottom = H - labelH - rainH - fs * .4;
        const rainBase = H - labelH;

        const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
        const x = t => padX + (t - t0) / (t1 - t0) * (W - 2 * padX);

        const temps = pts.map(p => p.temp);
        let lo = Math.min(...temps), hi = Math.max(...temps);
        if (hi - lo < 2) { const m = (hi + lo) / 2; lo = m - 1; hi = m + 1; }
        const pad = (hi - lo) * .25;
        lo -= pad; hi += pad;
        const y = v => topPad + (hi - v) / (hi - lo) * (yBottom - topPad);

        let d = 'M' + x(pts[0].t) + ',' + y(pts[0].temp);
        for (let i = 1; i < pts.length; i++) {
            const x0 = x(pts[i - 1].t), y0 = y(pts[i - 1].temp), x1 = x(pts[i].t), y1 = y(pts[i].temp), mx = (x0 + x1) / 2;
            d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
        }
        const area = d + ` L${x(t1)},${yBottom + fs * .3} L${x(t0)},${yBottom + fs * .3} Z`;

        const maxRain = Math.max(1, ...pts.map(p => p.rain));
        const bw = Math.max(3, (W - 2 * padX) / (pts.length - 1) * .62);
        let bars = '';
        pts.forEach(p => {
            const h = p.rain > 0 ? Math.max(2, p.rain / maxRain * rainH) : 0;
            if (h) bars += `<rect x="${x(p.t) - bw / 2}" y="${rainBase - h}" width="${bw}" height="${h}" rx="${Math.min(bw / 2, 4)}" fill="url(#rg)"/>`;
        });

        let marks = '', xl = '';
        pts.forEach((p, i) => {
            const dt = new Date(p.t * 1000);
            const full = dt.getMinutes() === 0;
            if (i === 0 || full) {
                const cx = x(p.t), cy = y(p.temp);
                const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
                const lx = i === 0 ? cx - fs * .2 : (i === pts.length - 1 ? cx + fs * .2 : cx);
                marks += `<line x1="${cx}" x2="${cx}" y1="${cy}" y2="${rainBase}" stroke="rgba(0,0,0,.15)" stroke-dasharray="3 5"/>` +
                    `<circle cx="${cx}" cy="${cy}" r="${fs * .32}" fill="#ffffff" stroke="#2b7a33" stroke-width="${fs * .16}"/>` +
                    `<text x="${lx}" y="${cy - fs * 0.8}" text-anchor="${anchor}" font-size="${fs * 1.1}" font-weight="600" fill="#111">${Math.round(p.temp)}°</text>`;
                const lab = i === 0 ? 'nu' : dt.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
                xl += `<text x="${lx}" y="${H - fs * .2}" text-anchor="${anchor}" font-size="${fs * 0.95}" fill="#666">${lab}</text>`;
            }
        });

        chartEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" font-family="inherit">
        <defs>
          <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3fae49" stop-opacity=".25"/><stop offset="1" stop-color="#3fae49" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3aa6ff"/><stop offset="1" stop-color="#0077cc"/>
          </linearGradient>
        </defs>
        <line x1="${padX}" x2="${W - padX}" y1="${rainBase}" y2="${rainBase}" stroke="rgba(0,0,0,.15)"/>
        <path d="${area}" fill="url(#ag)"/>
        <path d="${d}" fill="none" stroke="#3fae49" stroke-width="${Math.max(2.5, fs * .25)}" stroke-linecap="round" stroke-linejoin="round"/>
        ${bars}${marks}${xl}
    </svg>`;

        const rainSum = pts.slice(0, step === 900 ? 12 : 3).reduce((a, p) => a + (p.rain || 0), 0);
        const tmin = Math.round(Math.min(...temps)), tmax = Math.round(Math.max(...temps));
        document.getElementById('chartsummary').innerHTML =
            '<b>' + (tmin === tmax ? tmin + '°' : tmin + '° – ' + tmax + '°') + '</b> &nbsp;·&nbsp; <i>' + nl(rainSum, 1) + ' mm</i>';
    }

    const RADAR_MODE = 'gadget';
    const radarIframe = document.getElementById('radariframe');
    const radarImg = document.getElementById('radarimg');
    const radarFrame = document.getElementById('radarframe');
    const mapCard = document.getElementById('mapcard');
    const RADAR_W = 550, RADAR_H = 512;
    let radarKey = '';

    function radarImageUrl(w, h) {
        return 'https://image.buienradar.nl/2.0/image/single/RadarMapRainNL?height=' + h + '&width=' + w +
            '&renderBackground=True&renderBranding=True&renderText=True&_=' + Date.now();
    }

    function refreshRadar() {
        if (RADAR_MODE === 'gadget') {
            radarIframe.src = RADAR_URL + '&_=' + Date.now();
            return;
        }
        const w = Math.max(200, Math.round(radarFrame.clientWidth)), h = Math.max(200, Math.round(radarFrame.clientHeight));
        radarKey = w + 'x' + h;
        radarImg.src = radarImageUrl(w, h);
    }

    radarImg.addEventListener('error', () => {
        if (!radarImg.dataset.retry) { radarImg.dataset.retry = '1'; radarImg.src = radarImageUrl(RADAR_W, RADAR_H); }
    });
    radarImg.addEventListener('load', () => { delete radarImg.dataset.retry; });

    function fitRadar() {
        if (RADAR_MODE === 'gadget') {
            const h = radarFrame.clientHeight;
            if (!h) return;
            const extra = mapCard.clientWidth - radarFrame.clientWidth;
            mapCard.style.width = Math.round(h * RADAR_W / RADAR_H + Math.max(extra, 0)) + 'px';
            const sc = Math.min(radarFrame.clientWidth / RADAR_W, radarFrame.clientHeight / RADAR_H);
            radarIframe.style.transform = 'translate(-50%, -50%) scale(' + sc + ')';
            return;
        }
        const key = Math.round(radarFrame.clientWidth) + 'x' + Math.round(radarFrame.clientHeight);
        if (radarFrame.clientWidth > 50 && key !== radarKey) refreshRadar();
    }

    if (RADAR_MODE === 'gadget') {
        radarImg.hidden = true; radarIframe.hidden = false;
        refreshRadar();
    } else {
        document.querySelector('.grid').classList.add('imagemode');
    }

    function relayout() { fitRadar(); drawChart(); }
    
    const resizeObserver = new ResizeObserver(() => {
        requestAnimationFrame(relayout);
    });
    resizeObserver.observe(chartEl);

    window.addEventListener('resize', () => { relayout(); });

    requestAnimationFrame(() => { relayout(); });
    loadBuienradar();
    loadShortTerm();

    setInterval(loadBuienradar, 5 * 60 * 1000);
    setInterval(loadShortTerm, 10 * 60 * 1000);
    setInterval(drawChart, 60 * 1000);
    setInterval(refreshRadar, 5 * 60 * 1000);
    setInterval(() => location.reload(), 60 * 60 * 1000);
</script>
</body>
</html>
